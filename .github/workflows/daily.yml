name: 赛博早安日报

on:
  schedule:
    - cron: '30 22 * * *' # UTC 22:30 = 北京时间每天早上 06:30
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成今日早报
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          COINS: ${{ vars.COINS }}
        run: node generate.mjs

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "📰 早安日报 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          git push
